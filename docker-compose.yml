services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - tradepilot_data:/app/data
    environment:
      APP_ENV: docker
      DATABASE_URL: sqlite:////app/data/tradepilot.db
      CORS_ORIGINS: http://localhost:8080
      API_DOCS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tradepilot_data:
